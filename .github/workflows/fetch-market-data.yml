name: Fetch market data

# Manual-only: the dataset under data/ is committed; re-run this workflow
# from the Actions tab only when the series need to be refreshed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Fetch daily index history
        run: python3 scripts/fetch_market_data.py

      - name: Commit data back to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data ] && git add data
          git commit -m "Add TAIEX / Nasdaq daily history fetched from TWSE, FRED, Yahoo" || echo "nothing to commit"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push
